<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f5e6c8"/>
      <stop offset="70%" stop-color="#c4956a"/>
      <stop offset="100%" stop-color="#6b3a1f"/>
    </radialGradient>
    <linearGradient id="potBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b4513"/>
      <stop offset="50%" stop-color="#5c2e0a"/>
      <stop offset="100%" stop-color="#3a1a05"/>
    </linearGradient>
    <linearGradient id="potRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a0522d"/>
      <stop offset="100%" stop-color="#6b3410"/>
    </linearGradient>
    <linearGradient id="leaf1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a7c3f"/>
      <stop offset="100%" stop-color="#2d5a23"/>
    </linearGradient>
    <linearGradient id="leaf2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6aad50"/>
      <stop offset="100%" stop-color="#3d7a2e"/>
    </linearGradient>
  </defs>

  <!-- 温暖背景 -->
  <rect width="64" height="64" rx="8" fill="url(#bg)"/>

  <!-- 桌面/底部暗色区 -->
  <ellipse cx="32" cy="56" rx="28" ry="8" fill="#3a1a05" opacity="0.4"/>

  <!-- 药壶主体 -->
  <ellipse cx="32" cy="42" rx="11" ry="13" fill="url(#potBody)"/>
  <!-- 药壶壶口 -->
  <ellipse cx="32" cy="30" rx="7" ry="3" fill="url(#potRim)"/>
  <!-- 药壶高光 -->
  <ellipse cx="29" cy="38" rx="3" ry="6" fill="#a0522d" opacity="0.4"/>

  <!-- 壶盖 -->
  <ellipse cx="32" cy="28" rx="5" ry="2" fill="#704020"/>
  <circle cx="32" cy="26" r="2" fill="#8b5e3c"/>

  <!-- 左侧草药叶 -->
  <path d="M14 35 Q10 28 14 20 Q16 24 15 30 Z" fill="url(#leaf1)"/>
  <path d="M16 38 Q11 32 13 24 Q15 28 15 34 Z" fill="url(#leaf2)"/>
  <path d="M12 40 Q8 34 11 27 Q13 31 12 36 Z" fill="#3d6b2e" opacity="0.8"/>

  <!-- 右侧草药叶 -->
  <path d="M50 35 Q54 28 50 20 Q48 24 49 30 Z" fill="url(#leaf1)"/>
  <path d="M48 38 Q53 32 51 24 Q49 28 49 34 Z" fill="url(#leaf2)"/>
  <path d="M52 40 Q56 34 53 27 Q51 31 52 36 Z" fill="#3d6b2e" opacity="0.8"/>

  <!-- 顶部草药/花 -->
  <path d="M24 22 Q20 16 22 10 Q24 14 24 18 Z" fill="url(#leaf2)" opacity="0.9"/>
  <path d="M40 22 Q44 16 42 10 Q40 14 40 18 Z" fill="url(#leaf2)" opacity="0.9"/>

  <!-- 小花朵装饰(左) -->
  <circle cx="18" cy="18" r="2.5" fill="#e8a0a0" opacity="0.8"/>
  <circle cx="16" cy="16" r="1.5" fill="#d4756a" opacity="0.6"/>

  <!-- 小花朵装饰(右) -->
  <circle cx="46" cy="18" r="2.5" fill="#f0c080" opacity="0.8"/>
  <circle cx="48" cy="16" r="1.5" fill="#e0a050" opacity="0.6"/>

  <!-- 散落的草药颗粒/种子 -->
  <circle cx="20" cy="50" r="1.2" fill="#8b6914"/>
  <circle cx="23" cy="52" r="1" fill="#6b4f10"/>
  <circle cx="44" cy="50" r="1.2" fill="#8b6914"/>
  <circle cx="41" cy="52" r="1" fill="#6b4f10"/>
  <circle cx="26" cy="54" r="0.8" fill="#a07820"/>
  <circle cx="38" cy="54" r="0.8" fill="#a07820"/>

  <!-- 底部散落的小叶片 -->
  <path d="M22 48 Q20 46 22 44 Q23 46 22 47 Z" fill="#4a7c3f" opacity="0.6"/>
  <path d="M42 48 Q44 46 42 44 Q41 46 42 47 Z" fill="#4a7c3f" opacity="0.6"/>
</svg>
